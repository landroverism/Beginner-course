<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tables.css">
    <title>Tables</title>
</head>
<div class="search-bar">
        <input type="text" placeholder="Search">
        <button type="submit">
            <img src="photos/search.png" alt="Search icon">
        </button>
    </div>
<body>
    <table border="1">
        <h1>Student Details</h1>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
            <th>House</th>
        </tr>
        <tr>
            <td>Payslee</td>
            <td>6</td>
            <td>1</td>
            <td>Purple</td>
        </tr>
        <tr>
            <td>Mia</td>
            <td>6</td>
            <td>1</td>
            <td>Green</td>
        </tr>
    </table>
    <div class="form">
    <label>Name</label><br>
    <input type="text" class="inputs"><br><br>
    <label>Age</label><br>
     <input type="number" class="inputs"><br><br>
    <label>Grade</label><br>
     <input type="number" class="inputs"><br><br>
    <label>House</label><br>
     <input type="text" class="inputs"><br><br>
     <button type="submit" class="btn">Add</button>
    </div>
</body>
</html>
